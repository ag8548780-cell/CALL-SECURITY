name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [project.zip]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q project.zip -d work
      - name: Write server config from Secrets
        env:
          SU: ${{ secrets.SUPABASE_URL }}
          SK: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf 'package com.callsecurity.app\nobject Config { const val URL = "%s"; const val KEY = "%s" }\n' "$SU" "$SK" > work/app/src/main/java/com/callsecurity/app/Config.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: work
        run: gradle :app:assembleDebug --no-daemon
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CALL SECURITY build ${{ github.run_number }}
          make_latest: true
          files: work/app/build/outputs/apk/debug/app-debug.apk
          
